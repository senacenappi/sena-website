<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{name}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{name}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{ogimage}}">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Gowun+Batang&family=Pinyon+Script&display=swap">
<style>
/* Layout: white page, name and three links on top, the works drifting in one band, then a quiet list. Monochrome. */
:root{
  --paper:#FFFFFF;
  --sweep:#F0F0EE;
  --ink:#17181B;
  --ink-2:#5C5E63;
  --rule:#D6D6D2;
  --seal:#17181B;
  --f-script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --f-display:"Cormorant Garamond","Gowun Batang","Garamond","Baskerville",Georgia,serif;
  --f-ko:"Gowun Batang","AppleMyungjo","Batang",serif;
  --f-ui:"Cormorant Garamond","Gowun Batang","Garamond","Baskerville",Georgia,serif;
  --gut:clamp(16px,4vw,56px);
  --mh:clamp(210px,46vh,480px);
  --mgap:clamp(20px,3vw,40px);
  --head-h:64px;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--seal);outline-offset:3px}
.wrap{max-width:1360px;margin-inline:auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.label{font-family:var(--f-ui);font-size:13px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* Header */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:var(--head-h)}
.mark{text-decoration:none}
.name{font-family:var(--f-script);font-weight:400;font-size:32px;line-height:1;letter-spacing:0}
.nav{display:flex;gap:clamp(14px,2.6vw,32px)}
.nav a{font-size:14.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding-block:8px;border-bottom:1.5px solid transparent;color:var(--ink-2)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}

/* Index: moving band (drifts on its own; drag, swipe or use the arrows to scroll it) */
.band{position:relative;background:var(--paper);padding-block:clamp(24px,4vw,48px) clamp(12px,1.5vw,18px)}
.viewport{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.viewport::-webkit-scrollbar{display:none}
.viewport.dragging{cursor:grabbing;user-select:none}
.viewport:focus-visible{outline-offset:-2px}
.track{display:flex;width:max-content}
.set{display:flex;gap:var(--mgap);padding-right:var(--mgap);align-items:flex-start}
.set:first-child{padding-left:max(var(--gut),env(safe-area-inset-left,0px))}
.set.dup{padding-left:0}
.mq{display:flex;flex-direction:column;gap:10px;width:calc(var(--mh) * var(--ar));text-decoration:none;flex:none}
.mq img{width:100%;height:var(--mh);object-fit:cover;background:var(--rule);-webkit-user-drag:none;user-select:none}
.mq .cap{display:flex;gap:10px;align-items:baseline;font-size:14px;line-height:1.35;color:var(--ink-2)}
.mq .cap span{font-family:var(--f-display);font-size:15.5px;line-height:1.3}
.mq .cap b{font-weight:500;color:var(--ink)}
.mq:hover .cap span,.mq:focus-visible .cap span{color:var(--ink);text-decoration:underline;text-decoration-color:var(--seal);text-underline-offset:3px}
.band-foot{display:flex;justify-content:flex-end;align-items:center;gap:22px;margin-top:clamp(10px,1.5vw,16px)}
.band-arrows{display:flex;gap:6px}
.band-arrow{font:inherit;font-size:19px;line-height:1;color:var(--ink-2);background:none;border:0;padding:6px 8px;cursor:pointer}
.band-arrow:hover{color:var(--ink)}
.pause{font:inherit;font-size:13px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);background:none;border:0;padding:6px 0;cursor:pointer}
.pause:hover{color:var(--ink)}
@media (prefers-reduced-motion: reduce){
  .pause{display:none}
}

/* Index: list of works */
.checklist{padding-block:clamp(32px,5vw,56px) clamp(48px,7vw,88px)}
.cl-cols{display:grid;grid-template-columns:104px minmax(0,1fr);gap:24px;padding-block:10px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.cl-cols .txt{display:grid;grid-template-columns:44px minmax(0,2.2fr) 56px minmax(0,1.7fr) minmax(0,1.3fr);gap:20px}
.cl{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:24px;align-items:center;padding-block:14px;border-bottom:1px solid var(--rule);text-decoration:none;transition:background-color .2s}
.row:hover{background:color-mix(in srgb,var(--sweep) 70%,transparent)}
.row .th{aspect-ratio:4/3;width:100%;object-fit:cover;background:var(--sweep)}
.row .txt{display:grid;grid-template-columns:44px minmax(0,2.2fr) 56px minmax(0,1.7fr) minmax(0,1.3fr);gap:20px;align-items:baseline;min-width:0}
.row .no{font-size:14.5px;color:var(--ink-2)}
.row .t{font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.25;text-wrap:balance}
.row:hover .t{text-decoration:underline;text-decoration-color:var(--seal);text-underline-offset:4px;text-decoration-thickness:1.5px}
.row .y,.row .m,.row .d{font-size:14.5px;color:var(--ink-2)}
@media (max-width:860px){
  .cl-cols{display:none}
  .cl{border-top:1px solid var(--ink)}
  .row{grid-template-columns:88px minmax(0,1fr);gap:16px;align-items:start}
  .row .txt{display:flex;flex-direction:column;gap:3px}
  .row .t{font-size:19px}
  .row .no::after{content:" · " attr(data-year)}
  .row .y{display:none}
}

/* Work page */
.work{padding-block:clamp(18px,2.5vw,28px) clamp(40px,6vw,72px)}
.work-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:clamp(18px,2.5vw,28px)}
.back{font-size:14.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--ink-2)}
.back:hover{color:var(--ink)}
.work-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:clamp(28px,4vw,64px);align-items:start}
.plate{margin:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head-h) + 20px)}
.plate img{width:auto;max-width:100%;height:auto;max-height:calc(100vh - var(--head-h) - 80px);background:var(--sweep)}
.plate figcaption{margin-top:10px;font-size:14px;color:var(--ink-2)}
.info{min-width:0;display:flex;flex-direction:column;gap:22px}
.info .label{margin:0}
.info h1{font-family:var(--f-display);font-weight:500;font-size:clamp(32px,3.8vw,52px);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:0}
.ko-title{font-family:var(--f-ko);font-size:17px;color:var(--ink-2);margin:-10px 0 0}
.facts{margin:0;border-top:1px solid var(--rule)}
.facts div{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:16px;padding-block:11px;border-bottom:1px solid var(--rule)}
.facts dt{font-size:13px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);padding-top:2px}
.facts dd{margin:0;font-size:16.5px}
.facts .cm{display:block;color:var(--ink-2);font-size:14.5px}
.statement{border-top:1px solid var(--ink);padding-top:16px;display:flex;flex-direction:column;gap:16px}
.st-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.st-head h2{margin:0}
.lang{display:flex;gap:4px}
.lang button{font:inherit;font-size:14px;font-weight:500;color:var(--ink-2);background:none;border:0;border-bottom:1.5px solid transparent;padding:4px 6px;cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--seal)}
.st-body p{font-family:var(--f-display);font-weight:400;font-size:19.5px;line-height:1.6;margin:0 0 1em;max-width:62ch}
.st-body p:last-child{margin-bottom:0}
.st-body .cjk{font-family:var(--f-ko);font-size:.74em;letter-spacing:.02em;vertical-align:.04em}
.st-body[lang="ko"] p{font-family:var(--f-ko);word-break:keep-all;font-size:16px;line-height:1.95}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,3vw,40px);margin-top:clamp(48px,7vw,88px);border-top:1px solid var(--ink)}
.pn a{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;align-items:center;padding-top:18px;text-decoration:none}
.pn a.next{grid-template-columns:minmax(0,1fr) 72px;text-align:right}
.pn a.next img{order:2}
.pn img{width:72px;aspect-ratio:1;object-fit:cover;background:var(--sweep)}
.pn .t{display:block;font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.3;margin-top:4px;text-wrap:balance}
.pn a:hover .t{text-decoration:underline;text-decoration-color:var(--seal);text-underline-offset:4px}
@media (max-width:900px){
  .work-grid{grid-template-columns:minmax(0,1fr)}
  .plate{position:static}
  .plate img{max-height:none;width:100%}
}
@media (max-width:560px){
  .pn{grid-template-columns:minmax(0,1fr)}
  .pn a,.pn a.next{grid-template-columns:56px minmax(0,1fr);text-align:left}
  .pn a.next img{order:0}
  .pn img{width:56px}
}

/* Expanded image view */
.plate-btn{display:block;padding:0;border:0;background:none;cursor:zoom-in;max-width:100%}
.plate-cap{display:flex;justify-content:flex-end;margin-top:8px}
.plate.has-details{position:static}
.details{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.detail{display:block;padding:0;border:0;background:var(--sweep);cursor:zoom-in;height:clamp(92px,10vw,148px);aspect-ratio:var(--ar);max-width:100%}
.detail img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .2s}
.detail:hover img{opacity:.82}
.lb-btn{font:inherit;font-size:13px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);background:none;border:0;padding:8px 0;cursor:pointer}
.lb-btn:hover{color:var(--ink)}
html.lb-open{overflow:hidden}
.lb{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:var(--paper);color:var(--ink);overflow:hidden}
.lb[open]{display:grid;grid-template-rows:auto minmax(0,1fr)}
.lb::backdrop{background:var(--paper)}
.lb-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.lb-cap{margin:0;display:flex;gap:12px;align-items:baseline;min-width:0;font-size:14.5px;color:var(--ink-2)}
.lb-cap #lb-title{font-family:var(--f-display);font-weight:500;font-size:18px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-actions{display:flex;gap:20px;flex:none}
.lb-stage{position:relative;overflow:hidden;display:grid;place-items:center;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(calc(var(--gut) + 36px),env(safe-area-inset-left,0px));padding-right:max(calc(var(--gut) + 36px),env(safe-area-inset-right,0px));touch-action:pan-y}
.lb-stage img{max-width:100%;max-height:calc(100vh - 90px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 90px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));width:auto;height:auto;cursor:zoom-in;user-select:none;-webkit-user-drag:none}
.lb.zoomed .lb-stage{display:block;overflow:auto;padding:0;touch-action:auto}
.lb.zoomed .lb-stage img{display:block;max-width:none;max-height:none;margin:0 auto;cursor:zoom-out}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;display:grid;place-items:center;font:inherit;font-size:20px;color:var(--ink-2);background:none;border:0;cursor:pointer}
.lb-nav:hover{color:var(--ink)}
.lb-nav.prev{left:max(4px,env(safe-area-inset-left,0px))}
.lb-nav.next{right:max(4px,env(safe-area-inset-right,0px))}
.lb.zoomed .lb-nav{display:none}
@media (max-width:560px){
  .lb-stage{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .lb-nav{top:auto;bottom:calc(4px + env(safe-area-inset-bottom,0px));transform:none}
  .lb-stage{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}

/* About + Contact */
.about-main{display:flex;flex-direction:column;gap:clamp(40px,6vw,72px);min-width:0}
.cv{display:flex;flex-direction:column;gap:clamp(28px,4vw,44px)}
.cv-sec .label{margin:0 0 10px}
.cv-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.cv-list li{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:16px;padding-block:10px;border-bottom:1px solid var(--rule);align-items:baseline}
.cv-y{color:var(--ink-2);font-size:15px}
.cv-t{font-family:var(--f-display);font-size:18px;line-height:1.4}
.page{padding-block:clamp(32px,5vw,64px) clamp(56px,8vw,104px)}
.page-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(24px,4vw,64px)}
.page-h{font-family:var(--f-script);font-weight:400;font-size:clamp(56px,7.5vw,104px);line-height:1.15;margin:0;padding-bottom:.08em;letter-spacing:0}
.prose p{font-family:var(--f-display);font-weight:400;font-size:clamp(19px,1.7vw,22px);line-height:1.6;margin:0 0 1.1em;max-width:36em}
.prose p:first-child{font-weight:500;font-size:clamp(22px,2.2vw,28px);line-height:1.4}

.channels{margin:0;border-top:1px solid var(--ink)}
.channels div{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:16px;align-items:center;padding-block:16px;border-bottom:1px solid var(--rule)}
.channels dt{font-size:13px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2)}
.channels dd{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font-family:var(--f-display);font-size:clamp(20px,2.1vw,26px);overflow-wrap:anywhere}
.todo{font-family:var(--f-ui);font-size:14.5px;color:var(--ink-2);border:1px dashed var(--ink-2);padding:4px 10px;border-radius:2px}
.btn{font:inherit;font-family:var(--f-ui);font-size:13.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:none;border:1px solid var(--ink);padding:7px 14px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--paper)}
.kinds{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.kinds li{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:16px;padding-block:13px;border-bottom:1px solid var(--rule)}
.kinds b{font-family:var(--f-display);font-weight:500;font-size:18.5px}
.kinds span{color:var(--ink-2)}
.contact-main{display:flex;flex-direction:column;gap:clamp(32px,5vw,56px);min-width:0}
.contact-main .label{margin:0 0 10px}
.contact-lede{font-family:var(--f-display);font-weight:400;font-size:clamp(21px,2.2vw,28px);line-height:1.45;margin:0;max-width:30em}
@media (max-width:820px){
  .page-grid{grid-template-columns:minmax(0,1fr)}
  .kinds li{grid-template-columns:minmax(0,1fr);gap:2px}
  .channels div,.facts div{grid-template-columns:7em minmax(0,1fr)}
}

.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 28px;border-top:1px solid var(--rule);font-size:14px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:14.5px;padding:9px 16px;border-radius:2px;z-index:20}
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap head-in">
    <a class="mark" href="#work"><span class="name">{{name}}</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#work" data-r="work">Work</a>
      <a href="#about" data-r="about">About</a>
      <a href="#contact" data-r="contact">Contact</a>
    </nav>
  </div>
</header>

<main id="view"></main>

<dialog class="lb" id="lb" aria-label="Expanded image">
  <div class="lb-bar">
    <p class="lb-cap"><span class="num" id="lb-no"></span><span id="lb-title"></span></p>
    <div class="lb-actions">
      <button type="button" class="lb-btn" id="lb-zoom" aria-pressed="false">Zoom</button>
      <button type="button" class="lb-btn" id="lb-close">Close</button>
    </div>
  </div>
  <div class="lb-stage" id="lb-stage"><img id="lb-img" alt="" draggable="false"></div>
  <button type="button" class="lb-nav prev" id="lb-prev" aria-label="Previous image">←</button>
  <button type="button" class="lb-nav next" id="lb-next" aria-label="Next image">→</button>
</dialog>

<footer class="wrap">
  <div class="foot"><span>© {{year}} {{name}}</span><span>{{range}}</span></div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
const WORKS = __WORKS__;
const SITE = __SITE__;

const CONTACT = { email: SITE.email || "", instagram: SITE.instagram || "" };

const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const view = document.getElementById("view");
let lang = "en";
try { lang = localStorage.getItem("sena-lang") === "ko" ? "ko" : "en"; } catch (e) {}

// Wrap Chinese characters in English text so they can be sized to sit with the Latin type
const cjk = s => s.replace(/[\u3400-\u9FFF\uF900-\uFAFF]+/g, m => `<span class="cjk" lang="zh-Hant">${m}</span>`);

function altText(w){ return `${w.title} (${w.year}). ${w.medium}.`; }

function renderIndex(){
  const item = (w, dup) => `
    <a class="mq" href="#work-${pad(w.n)}" draggable="false" style="--ar:${(w.w / w.h).toFixed(4)}"${dup ? ' tabindex="-1" aria-hidden="true"' : ""}>
      <img src="${w.img}" alt="${dup ? "" : esc(altText(w))}" width="${w.w}" height="${w.h}" ${w.n > 5 ? 'loading="lazy"' : ""} decoding="async">
      <span class="cap"><b class="num">${pad(w.n)}</b><span>${esc(w.title)}</span></span>
    </a>`;

  const rows = WORKS.map(w => `
    <li><a class="row" href="#work-${pad(w.n)}">
      <img class="th" src="${w.thumb}" alt="" loading="lazy" decoding="async">
      <span class="txt">
        <span class="no num" data-year="${w.year}">${pad(w.n)}</span>
        <span class="t">${esc(w.title)}</span>
        <span class="y num">${w.year}</span>
        <span class="m">${esc(w.medium)}</span>
        <span class="d num">${esc(w.dimsIn)}</span>
      </span>
    </a></li>`).join("");

  view.innerHTML = `
    <section class="band" id="band" aria-label="Works">
      <div class="viewport" id="vp" tabindex="0" aria-label="Works. Scroll sideways to browse.">
        <div class="track" id="track">
          <div class="set">${WORKS.map(w => item(w, false)).join("")}</div>
          <div class="set dup">${WORKS.map(w => item(w, true)).join("")}</div>
        </div>
      </div>
      <div class="wrap band-foot">
        <div class="band-arrows">
          <button class="band-arrow" type="button" data-dir="-1" aria-label="Scroll back">←</button>
          <button class="band-arrow" type="button" data-dir="1" aria-label="Scroll forward">→</button>
        </div>
        <button class="pause" id="pause" type="button" aria-pressed="false">Pause</button>
      </div>
    </section>
    <section class="wrap checklist" aria-label="All works">
      <div class="cl-cols label" aria-hidden="true">
        <span></span>
        <span class="txt"><span>No.</span><span>Title</span><span>Year</span><span>Medium</span><span>Dimensions</span></span>
      </div>
      <ol class="cl">${rows}</ol>
    </section>`;

  startBand();
}

// The band holds the works twice; scrolling wraps by one set's width so it never ends.
function startBand(){
  const vp = document.getElementById("vp");
  const track = document.getElementById("track");
  const btn = document.getElementById("pause");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SPEED = 0.038; // px per ms
  let period = 0, pos = 1, last = 0, idleUntil = 0, focused = false;
  let paused = reduce, raf = 0, drag = null, moved = false, glide = null, wheelLeft = 0;

  const measure = () => { period = track.children[1].getBoundingClientRect().width; };
  const hold = (ms = 1500) => { idleUntil = performance.now() + ms; };
  const inRange = v => v >= period + 1 ? v - period : v < 1 ? v + period : v;

  measure();
  vp.scrollLeft = pos;
  const ro = new ResizeObserver(measure); ro.observe(track);

  const tick = now => {
    const dt = last ? Math.min(64, now - last) : 16; last = now;
    if (period) {
      if (wheelLeft) {
        const step = Math.abs(wheelLeft) < 0.5 ? wheelLeft : wheelLeft * Math.min(1, dt / 80);
        wheelLeft -= step;
        pos = inRange(vp.scrollLeft + step);
        vp.scrollLeft = pos;
      } else if (glide) {
        const k = Math.min(1, (now - glide.t0) / 700), e = 1 - Math.pow(1 - k, 3);
        let p = glide.from + (glide.to - glide.from) * e;
        const q = inRange(p);
        if (q !== p) { glide.from += q - p; glide.to += q - p; p = q; }
        pos = p; vp.scrollLeft = pos;
        if (k === 1) { glide = null; hold(); }
      } else if (!paused && !focused && !drag && now > idleUntil) {
        pos = inRange(pos + dt * SPEED);
        vp.scrollLeft = pos;
      } else {
        pos = vp.scrollLeft;
      }
    }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);

  vp.addEventListener("scroll", () => {
    if (glide || !period) return;
    const s = vp.scrollLeft, n = inRange(s);
    if (n !== s) { vp.scrollLeft = n; pos = n; if (drag) drag.s += n - s; }
  }, { passive: true });

  // Mouse wheel and trackpad (either direction) scroll the pieces sideways while the pointer is over them
  vp.addEventListener("wheel", e => {
    if (e.ctrlKey) return;
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? vp.clientWidth : 1;
    const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * unit;
    if (!d) return;
    e.preventDefault();
    glide = null;
    wheelLeft += d;
    hold();
  }, { passive: false });
  vp.addEventListener("touchstart", () => hold(3500), { passive: true });
  vp.addEventListener("touchmove", () => hold(3500), { passive: true });
  vp.addEventListener("focusin", e => { focused = e.target.matches(":focus-visible"); });
  vp.addEventListener("focusout", () => { focused = false; hold(); });

  // Drag to scroll with a mouse (touch scrolls natively)
  vp.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    glide = null; drag = { x: e.clientX, s: vp.scrollLeft, id: e.pointerId }; moved = false;
  });
  vp.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (!moved && Math.abs(dx) > 5) { moved = true; vp.setPointerCapture(drag.id); vp.classList.add("dragging"); }
    if (moved) vp.scrollLeft = drag.s - dx;
  });
  const endDrag = () => { if (drag) { drag = null; vp.classList.remove("dragging"); hold(); } };
  vp.addEventListener("pointerup", endDrag);
  vp.addEventListener("pointercancel", endDrag);
  vp.addEventListener("click", e => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);

  document.querySelectorAll(".band-arrow").forEach(b => b.addEventListener("click", () => {
    const step = Math.max(240, vp.clientWidth * 0.6) * Number(b.dataset.dir);
    const from = glide ? glide.to : vp.scrollLeft;
    glide = { from: glide ? vp.scrollLeft : from, to: from + step, t0: performance.now() };
    hold(4000);
  }));

  btn.addEventListener("click", () => {
    paused = !paused;
    btn.setAttribute("aria-pressed", String(paused));
    btn.textContent = paused ? "Play" : "Pause";
  });

  bandStop = () => { cancelAnimationFrame(raf); ro.disconnect(); };
}
let bandStop = null;

function renderWork(n){
  const i = WORKS.findIndex(w => w.n === n);
  if (i < 0) return renderIndex();
  const w = WORKS[i];
  const prev = WORKS[(i - 1 + WORKS.length) % WORKS.length];
  const next = WORKS[(i + 1) % WORKS.length];
  const langs = [w.en.length ? "en" : "", w.ko.length ? "ko" : ""].filter(Boolean);
  const hasStatement = langs.length > 0;
  const shown = () => langs.includes(lang) ? lang : langs[0];
  const body = () => shown() === "ko"
    ? `<div class="st-body" lang="ko">${w.ko.map(p => `<p>${esc(p)}</p>`).join("")}</div>`
    : `<div class="st-body" lang="en">${w.en.map(p => `<p>${cjk(esc(p))}</p>`).join("")}</div>`;

  view.innerHTML = `
    <article class="wrap work">
      <div class="work-bar">
        <a class="back" href="#work">← All works</a>
        <span class="label num">No. ${pad(w.n)} / ${pad(WORKS.length)}</span>
      </div>
      <div class="work-grid">
        <figure class="plate${w.details.length ? " has-details" : ""}">
          <button type="button" class="plate-btn" data-expand="0" aria-label="Expand image">
            <img src="${w.img}" alt="${esc(altText(w))}" width="${w.w}" height="${w.h}" decoding="async">
          </button>
          <div class="plate-cap"><button type="button" class="lb-btn" data-expand="0">Expand ⤢</button></div>
          ${w.details.length ? `
          <div class="details" role="group" aria-label="Detail views">
            ${w.details.map((d, k) => `<button type="button" class="detail" data-expand="${k + 1}" style="--ar:${(d.w / d.h).toFixed(4)}" aria-label="Expand detail ${k + 1} of ${w.details.length}"><img src="${d.thumb}" alt="${esc(w.title)}, detail ${k + 1}" width="${d.w}" height="${d.h}" loading="lazy" decoding="async"></button>`).join("")}
          </div>` : ""}
        </figure>
        <div class="info">
          <p class="label num">No. ${pad(w.n)}${w.year ? " · " + esc(w.year) : ""}</p>
          <h1>${esc(w.title)}</h1>
          ${w.titleKo ? `<p class="ko-title" lang="ko">${esc(w.titleKo)}</p>` : ""}
          <dl class="facts">
            ${w.medium ? `<div><dt>Medium</dt><dd>${esc(w.medium)}</dd></div>` : ""}
            ${w.dimsIn || w.dimsCm ? `<div><dt>Dimensions</dt><dd class="num">${esc(w.dimsIn)}${w.dimsCm ? `<span class="cm">${esc(w.dimsCm)}</span>` : ""}</dd></div>` : ""}
          </dl>
          ${hasStatement ? `
          <section class="statement" aria-labelledby="st-h">
            <div class="st-head">
              <h2 class="label" id="st-h">Statement</h2>
              ${langs.length > 1 ? `<div class="lang" role="group" aria-label="Statement language">
                <button type="button" data-lang="en" aria-pressed="${shown() === "en"}">English</button>
                <button type="button" data-lang="ko" lang="ko" aria-pressed="${shown() === "ko"}">한국어</button>
              </div>` : ""}
            </div>
            <div id="st">${body()}</div>
          </section>` : ""}
        </div>
      </div>
      <nav class="pn" aria-label="More works">
        <a class="prev" href="#work-${pad(prev.n)}">
          <img src="${prev.thumb}" alt="" loading="lazy">
          <span><span class="label">Previous · No. ${pad(prev.n)}</span><span class="t">${esc(prev.title)}</span></span>
        </a>
        <a class="next" href="#work-${pad(next.n)}">
          <img src="${next.thumb}" alt="" loading="lazy">
          <span><span class="label">Next · No. ${pad(next.n)}</span><span class="t">${esc(next.title)}</span></span>
        </a>
      </nav>
    </article>`;

  view.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("sena-lang", lang); } catch (e) {}
    view.querySelectorAll(".lang button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.lang === lang)));
    document.getElementById("st").innerHTML = body();
  }));
  view.querySelectorAll("[data-expand]").forEach(b => b.addEventListener("click", () => openLightbox(w.n, Number(b.dataset.expand) || 0)));
}

function renderAbout(){
  view.innerHTML = `
    <section class="wrap page">
      <div class="page-grid">
        <h1 class="page-h">About</h1>
        <div class="about-main">
          ${SITE.about.length ? `<div class="prose">${SITE.about.map(p => `<p>${esc(p)}</p>`).join("")}</div>` : ""}
          ${SITE.cv.length ? `<div class="cv">${SITE.cv.map(s => `
            <section class="cv-sec">
              ${s.heading ? `<h2 class="label">${esc(s.heading)}</h2>` : ""}
              <ul class="cv-list">${s.entries.map(e => `<li><span class="cv-y num">${esc(e.year)}</span><span class="cv-t">${esc(e.text)}</span></li>`).join("")}</ul>
            </section>`).join("")}</div>` : ""}
        </div>
      </div>
    </section>`;
}

function renderContact(){
  const email = CONTACT.email
    ? `<span id="email">${esc(CONTACT.email)}</span><button class="btn" type="button" data-copy="${esc(CONTACT.email)}">Copy</button>`
    : "";
  const insta = CONTACT.instagram
    ? `<a href="https://instagram.com/${esc(CONTACT.instagram.replace(/^@/, ""))}" target="_blank" rel="noopener">@${esc(CONTACT.instagram.replace(/^@/, ""))}</a>`
    : "";
  view.innerHTML = `
    <section class="wrap page">
      <div class="page-grid">
        <h1 class="page-h">Contact</h1>
        <div class="contact-main">
          ${SITE.contactIntro ? `<p class="contact-lede">${esc(SITE.contactIntro)}</p>` : ""}
          ${email || insta ? `<dl class="channels">
            ${email ? `<div><dt>Email</dt><dd>${email}</dd></div>` : ""}
            ${insta ? `<div><dt>Instagram</dt><dd>${insta}</dd></div>` : ""}
          </dl>` : ""}
        </div>
      </div>
    </section>`;

  view.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => copy(b.dataset.copy, document.getElementById("email"), "Email copied")));
}

function copy(text, el, msg){
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(el);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    toast("Selected. Press Copy on your device to copy it.");
  };
  try {
    navigator.clipboard.writeText(text).then(() => toast(msg), fallback);
  } catch (e) { fallback(); }
}

let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

// Expanded image view
const lb = document.getElementById("lb");
const lbImg = document.getElementById("lb-img");
const lbStage = document.getElementById("lb-stage");
const lbZoom = document.getElementById("lb-zoom");
let lbIndex = 0;
const SHOTS = WORKS.flatMap(w => [{ w, k: 0, img: w.img, iw: w.w, ih: w.h }]
  .concat(w.details.map((d, i) => ({ w, k: i + 1, img: d.img, iw: d.w, ih: d.h }))));

function lbShow(i){
  lbIndex = (i + SHOTS.length) % SHOTS.length;
  const s = SHOTS[lbIndex], w = s.w, total = 1 + w.details.length;
  setZoom(false);
  lbImg.width = s.iw; lbImg.height = s.ih;
  lbImg.src = s.img; lbImg.alt = s.k ? `${w.title}, detail ${s.k}` : altText(w);
  document.getElementById("lb-no").textContent = "No. " + pad(w.n) + (total > 1 ? ` · ${s.k + 1}/${total}` : "");
  document.getElementById("lb-title").textContent = w.title;
}
function openLightbox(n, k = 0){
  lbShow(Math.max(0, SHOTS.findIndex(s => s.w.n === n && s.k === k)));
  document.documentElement.classList.add("lb-open");
  if (!lb.open) lb.showModal();
}
function setZoom(on, ev){
  let rx = .5, ry = .5;
  if (on && ev) {
    const r = lbImg.getBoundingClientRect();
    rx = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    ry = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
  }
  lb.classList.toggle("zoomed", on);
  lbZoom.setAttribute("aria-pressed", String(on));
  lbZoom.textContent = on ? "Fit" : "Zoom";
  if (on) requestAnimationFrame(() => {
    lbStage.scrollLeft = lbImg.offsetLeft + rx * lbImg.offsetWidth - lbStage.clientWidth / 2;
    lbStage.scrollTop = lbImg.offsetTop + ry * lbImg.offsetHeight - lbStage.clientHeight / 2;
  });
}
let swipeX = null, swiped = false;
lbStage.addEventListener("pointerdown", e => { swiped = false; swipeX = lb.classList.contains("zoomed") ? null : e.clientX; });
lbStage.addEventListener("pointerup", e => {
  if (swipeX === null) return;
  const dx = e.clientX - swipeX; swipeX = null;
  if (Math.abs(dx) > 50) { swiped = true; lbShow(lbIndex + (dx < 0 ? 1 : -1)); }
});
lbImg.addEventListener("click", e => { if (swiped) return; setZoom(!lb.classList.contains("zoomed"), e); });
lbStage.addEventListener("click", e => { if (e.target === lbStage && !swiped && !lb.classList.contains("zoomed")) lb.close(); });
lbZoom.addEventListener("click", () => setZoom(!lb.classList.contains("zoomed")));
document.getElementById("lb-close").addEventListener("click", () => lb.close());
document.getElementById("lb-prev").addEventListener("click", () => lbShow(lbIndex - 1));
document.getElementById("lb-next").addEventListener("click", () => lbShow(lbIndex + 1));
lb.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { e.preventDefault(); lbShow(lbIndex - 1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); lbShow(lbIndex + 1); }
});
lb.addEventListener("close", () => {
  document.documentElement.classList.remove("lb-open");
  setZoom(false);
  const token = "work-" + pad(SHOTS[lbIndex].w.n);
  if (location.hash.replace(/^#/, "") !== token) location.hash = token;
});

function route(){
  if (bandStop) { bandStop(); bandStop = null; }
  const token = location.hash.replace(/^#/, "");
  const m = token.match(/^work-(\d{1,2})$/);
  let section = "work";
  if (m) renderWork(parseInt(m[1], 10));
  else if (token === "about") { section = "about"; renderAbout(); }
  else if (token === "contact") { section = "contact"; renderContact(); }
  else renderIndex();
  document.querySelectorAll(".nav a").forEach(a => {
    if (a.dataset.r === section) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
